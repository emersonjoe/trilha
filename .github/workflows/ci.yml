name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUNNER_CI || 'ubuntu-latest' }}
    strategy:
      matrix:
        go: ["1.22", "1.25"]
    steps:
      - name: Configure ephemeral Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l *.go h internal cmd examples tmpl ui)"
      - run: cd bench && go test ./... && go test -run XXX -bench . -benchtime=50ms
      - run: go vet ./...
      - run: go test ./...
      - name: Remove job caches
        if: always() && runner.environment == 'self-hosted'
        run: |
          go clean -cache -modcache
          rm -rf "$GOCACHE" "$GOMODCACHE"
  # O módulo opcional do OpenTelemetry tem go.mod próprio e piso próprio: o SDK
  # com as correções de segurança pede Go 1.26, o núcleo continua no 1.22.
  otel:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUNNER_CI || 'ubuntu-latest' }}
    steps:
      - name: Configure ephemeral Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - run: make test-otel
      - name: Remove job caches
        if: always() && runner.environment == 'self-hosted'
        run: |
          go clean -cache -modcache
          rm -rf "$GOCACHE" "$GOMODCACHE"
  # The CLI builds a binary and then runs it, which is where Windows differs:
  # no job here for a long time meant `trilha dev` was broken on it and green here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test ./...
  # Specs 164 and 170: the app in a real browser (module uitest/, with
  # Playwright), one job per engine people browse with. UITEST_REQUIRED=1
  # turns a browser that did not install into a failure. Blocking since M3
  # closed: a journey that breaks in one engine breaks the build.
  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: make test-ui-install
        env:
          UITEST_BROWSERS: ${{ matrix.browser }}
          WITH_DEPS: "1"
      - run: make test-ui
        env:
          UITEST_BROWSERS: ${{ matrix.browser }}
          UITEST_REQUIRED: "1"
      - name: Failure reports
        if: failure()
        run: cat uitest/report/*.txt || true
  # Spec 166: the SQL stores of billing and notify on SQLite and on a
  # PostgreSQL cluster the test starts (the runner has the programs).
  # Blocking since M3 closed, like the ui job.
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: make test-sql
        env:
          SQLTEST_POSTGRES: "1"
  security:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUNNER_CI || 'ubuntu-latest' }}
    steps:
      - name: Configure ephemeral Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - run: make security
      - name: Remove job caches
        if: always() && runner.environment == 'self-hosted'
        run: |
          go clean -cache -modcache
          rm -rf "$GOCACHE" "$GOMODCACHE"
  fuzz:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUNNER_CI || 'ubuntu-latest' }}
    steps:
      - name: Configure ephemeral Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - run: FUZZTIME=20s ./scripts/fuzz.sh
      - name: Remove job caches
        if: always() && runner.environment == 'self-hosted'
        run: |
          go clean -cache -modcache
          rm -rf "$GOCACHE" "$GOMODCACHE"
