name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUNNER_CI || 'ubuntu-latest' }}
    strategy:
      matrix:
        go: ["1.22", "1.25"]
    steps:
      - name: Configure ephemeral Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l *.go h internal cmd examples tmpl ui)"
      - run: cd bench && go test ./... && go test -run XXX -bench . -benchtime=50ms
      # O módulo opcional do OpenTelemetry tem go.mod próprio: roda aqui, ao
      # lado do bench, e não entra no `go test ./...` do núcleo.
      - run: cd otel && go vet ./... && go test ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Remove job caches
        if: always() && runner.environment == 'self-hosted'
        run: |
          go clean -cache -modcache
          rm -rf "$GOCACHE" "$GOMODCACHE"
  # The CLI builds a binary and then runs it, which is where Windows differs:
  # no job here for a long time meant `trilha dev` was broken on it and green here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test ./...
  security:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUNNER_CI || 'ubuntu-latest' }}
    steps:
      - name: Configure ephemeral Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - run: make security
      - name: Remove job caches
        if: always() && runner.environment == 'self-hosted'
        run: |
          go clean -cache -modcache
          rm -rf "$GOCACHE" "$GOMODCACHE"
  fuzz:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.RUNNER_CI || 'ubuntu-latest' }}
    steps:
      - name: Configure ephemeral Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - run: FUZZTIME=20s ./scripts/fuzz.sh
      - name: Remove job caches
        if: always() && runner.environment == 'self-hosted'
        run: |
          go clean -cache -modcache
          rm -rf "$GOCACHE" "$GOMODCACHE"
