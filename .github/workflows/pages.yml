name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "h/**", "ui/**", "tmpl/**", "*.go", "internal/**", "cmd/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Exportar o site com o próprio Trilha
        env:
          SITE_ANALYTICS: ${{ vars.SITE_ANALYTICS }}
          SITE_ORIGIN: https://emersonjoe.github.io
        run: cd site && go run ../cmd/trilha export -o ../_site --base /trilha
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
