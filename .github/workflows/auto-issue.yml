name: auto
run-name: "auto · issue #${{ inputs.issue || github.event.issue.number || 'mais antiga' }}"

# Resolve uma issue sozinho: o Claude Code escreve o código, um job independente roda a
# suíte e o lint, e a PR é mesclada sem revisão humana. O "Closes #n" fecha a issue.
#
# Pré-requisitos (uma vez, veja docs/automacao-issues.md):
#   1. Um segredo: ANTHROPIC_API_KEY (plataforma, cobrada por uso; tem prioridade) ou
#      CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, assinatura Max).
#   2. Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
#
# Disparo:  gh workflow run auto-issue.yml -f issue=123
#           ou basta pôr a label `auto` na issue.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Número da issue (vazio = a mais antiga com a label auto)"
        required: false
        default: ""
      modelo:
        description: "Modelo (vazio = sonnet, ou opus se a issue tem a label complexa)"
        required: false
        default: ""
  schedule:
    # De hora em hora pega a issue `auto` mais antiga que não tem PR em andamento. É a
    # rede de segurança: se um encadeamento morrer, a fila volta a andar sozinha.
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

# Uma execução por issue. O agendamento não sabe o número antes de resolver, então ele
# tem um grupo próprio e o `resolve` recusa uma issue que já está sendo trabalhada.
concurrency:
  group: auto-issue-${{ github.event.issue.number || inputs.issue || 'agendado' }}
  cancel-in-progress: false

jobs:
  resolve:
    # A label `auto` é a fronteira de confiança: só quem pode rotular uma issue deste
    # repositório consegue mandar o corpo dela para um agente com shell.
    if: github.event_name != 'issues' || github.event.label.name == 'auto'
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.cfg.outputs.issue }}
      branch: ${{ steps.cfg.outputs.branch }}
      modelo: ${{ steps.cfg.outputs.modelo }}
      prompt: ${{ steps.cfg.outputs.prompt }}
      prosseguir: ${{ steps.cfg.outputs.prosseguir }}
    steps:
      - uses: actions/checkout@v4
      - name: Escolher a issue e montar o prompt
        id: cfg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          PEDIDA: ${{ inputs.issue }}
          ROTULADA: ${{ github.event.issue.number }}
          MODELO_OVERRIDE: ${{ inputs.modelo }}
          PADRAO: ${{ github.event.repository.default_branch }}
        run: bash scripts/auto/resolve-issue.sh

  sessao:
    needs: resolve
    if: needs.resolve.outputs.prosseguir == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      pr: ${{ steps.pr.outputs.numero }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O ambiente do projeto é Go e mais nada: o runtime e a CLI não têm dependência
      # externa (princípio II), então não existe passo de instalação a fazer.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Aquecer o cache do módulo
        run: go build ./... || true

      - name: Claude Code — issue #${{ needs.resolve.outputs.issue }}
        uses: anthropics/claude-code-action@v1
        with:
          # A chave da plataforma tem prioridade; sem ela, o token da assinatura Max.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Sem isto, a execução disparada pelo próprio workflow é recusada com
          # "Workflow initiated by non-human actor".
          allowed_bots: "github-actions"
          show_full_output: true
          prompt: ${{ needs.resolve.outputs.prompt }}
          claude_args: |
            --model ${{ needs.resolve.outputs.modelo }}
            --max-turns 400
            --allowedTools "Bash,Read,Edit,Write,MultiEdit,Glob,Grep,WebFetch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Garantir a PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
          PADRAO: ${{ github.event.repository.default_branch }}
        run: bash scripts/auto/garantir-pr.sh

  verifica:
    needs: [resolve, sessao]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Checkout limpo da branch: o que é testado é o que está publicado, não a árvore
      # que a sessão deixou para trás.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # O ci.yml roda em `pull_request`, e uma PR aberta com o GITHUB_TOKEN não dispara
      # outros workflows — então este job é o único portão que a PR tem. Ele repete o
      # `test` e o `race` do ci.yml; windows, fuzz e govulncheck ficam para o push na
      # branch padrão, que dispara o ci.yml de verdade.
      - name: Lint (gofmt)
        run: test -z "$(gofmt -l *.go h internal cmd examples tmpl ui)"
      - name: go vet
        run: go vet ./...
      - name: Testes
        run: go test ./...
      - name: Testes do módulo bench
        run: cd bench && go test ./... && go test -run XXX -bench . -benchtime=50ms
      - name: Detector de corrida
        run: go test -race ./...
      - name: Registrar a falha na PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.sessao.outputs.pr }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'A verificação automática falhou: %s\n\nA PR fica aberta e o encadeamento para aqui — nada é mesclado sem a suíte verde.\n' "$EXECUCAO" |
            gh pr comment "$PR" --body-file -

  mescla:
    needs: [resolve, sessao, verifica]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mesclar, limpar a label e chamar a próxima
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.sessao.outputs.pr }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
        run: bash scripts/auto/mesclar-e-encadear.sh
