name: Bug
description: Something does not work the way the documentation says
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. The more reproducible, the faster we fix it. Reports in English or Portuguese are both welcome.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `trilha version` and `go version`
      placeholder: trilha 0.6.0 · go1.25.1 darwin/arm64
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: app/ tree that reproduces it
      description: The output of `find app -type f` (or `trilha routes`) from a minimal project showing the problem
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: Include the CLI output or the HTTP response (status and body)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [scanner/generator, runtime (Ctx, errors, render), h (DSL), tmpl, CLI dev, CLI build/export, documentation, other]
