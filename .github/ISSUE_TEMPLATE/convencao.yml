name: Proposta de convenção ou recurso
description: Uma convenção de arquivo nova, uma mudança de API ou um recurso
labels: ["proposta"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve?
      description: Descreva o cenário do ponto de vista de quem usa o framework, antes da solução
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como ficaria a árvore de app/ ou a API. Exemplos concretos ajudam mais que descrições
      render: text
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: constituicao
    attributes:
      label: Compatibilidade com a constituição do projeto
      options:
        - label: Não adiciona dependência fora da biblioteca padrão ao runtime ou à CLI
        - label: Não exige reflexão em runtime para descobrir handlers
        - label: Tem um exemplo em `examples/` e um teste que a exercite (ou o PR trará)
